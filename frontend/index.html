<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0E0E0F" />
    <!-- Ссылка из бота несёт токен входа (?lt=…). Старые вебвью по умолчанию
         отдают полный адрес чужим сайтам в Referer — оставляем им только домен. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Кампус</title>
    <!-- Bridge мессенджера MAX. Вне MAX объект window.WebApp не появится —
         приложение это переживает и уходит в режим разработки (см. src/shared/max.ts). -->
    <script src="https://st.max.ru/js/max-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
