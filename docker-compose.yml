# Образы — с точной версией, а не pg16/latest (решение 082): теги сверены по дайджесту
# с проверенными образами. Обновлять осознанно, вместе с scripts/deploy_vps.sh и README.
#
# Логи контейнеров — json-file с ротацией: по 10 МБ, три файла на сервис.
# Без лимита за недели проверки логи приложения и Caddy съели бы диск VPS (10 ГБ).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: campus-db
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus
      # Локаль C.UTF-8, а не ru_RU: её нет в образе, initdb на ней падает.
      # Полнотекстовому поиску это не мешает — конфигурация 'russian'
      # встроена в Postgres и от системной локали не зависит.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      # 5432 на хосте может быть занят локально установленным PostgreSQL —
      # тогда подключение снаружи уходит не в контейнер. Держим отдельный порт.
      # Только localhost: на VPS база с паролем campus не должна торчать наружу.
      - "127.0.0.1:5433:5432"
    volumes:
      - campus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: campus-app
    depends_on:
      db:
        condition: service_healthy
    # .env необязателен: на чистом клоне `docker compose up -d --build` поднимает всё
    # с умолчаниями из backend/app/core/config.py — бот и ассистент выключены,
    # остальное работает. Запись с required — Compose 2.24+ (решение 076).
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://campus:campus@db:5432/campus
      DATA_DIR: /data
      MAX_CA_BUNDLE: /app/certs/russian_trusted_bundle.pem
    ports:
      # Наружу приложение отдаёт туннель или Caddy, напрямую — только localhost.
      - "127.0.0.1:8000:8000"
    volumes:
      - campus_data:/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # Публичный HTTPS без своего домена и сертификата.
  # Запуск:  docker compose --profile tunnel up -d
  # Адрес появится в логах:  docker compose logs -f tunnel
  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    container_name: campus-tunnel
    profiles: ["tunnel"]
    depends_on:
      - app
    command: tunnel --no-autoupdate --url http://app:8000
    restart: unless-stopped
    logging: *default-logging

  # То же, но с постоянным адресом: бесплатный статический домен ngrok.
  # ${VAR:-} здесь и ниже — пустое значение без предупреждения compose, когда .env
  # нет или переменная не задана: профиль не запускается, и она не нужна.
  # В .env нужны NGROK_AUTHTOKEN и NGROK_DOMAIN (вида xxx.ngrok-free.app).
  # Запуск:  docker compose --profile ngrok up -d
  ngrok:
    image: ngrok/ngrok:3.39.8-debian
    container_name: campus-ngrok
    profiles: ["ngrok"]
    depends_on:
      - app
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: http app:8000 --url=https://${NGROK_DOMAIN:-}
    restart: unless-stopped
    logging: *default-logging

  # Постоянный адрес через tuna.am — российский аналог ngrok. ngrok с российских
  # IP больше не пускает (ERR_NGROK_9040). Зарезервированный поддомен есть только
  # на платном тарифе; бесплатный туннель живёт 30 минут.
  # В .env нужны TUNA_TOKEN и TUNA_SUBDOMAIN.
  # Запуск:  docker compose --profile tuna up -d
  tuna:
    image: yuccastream/tuna:0.35.1
    container_name: campus-tuna
    profiles: ["tuna"]
    depends_on:
      - app
    environment:
      TUNA_TOKEN: ${TUNA_TOKEN:-}
    # Инспектор выключен: он сохраняет запросы целиком, включая данные авторизации MAX.
    command: http app:8000 --subdomain=${TUNA_SUBDOMAIN:-} --location=ru --https-redirect --inspect=false
    restart: unless-stopped
    logging: *default-logging

  # Для VPS: HTTPS-вход с автоматическим сертификатом Let's Encrypt.
  # PUBLIC_HOST в .env — домен сервера, например 1-2-3-4.sslip.io (без покупки домена).
  # Запуск:  docker compose --profile vps up -d
  caddy:
    image: caddy:2.11.4-alpine
    container_name: campus-caddy
    profiles: ["vps"]
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${PUBLIC_HOST:-} --to app:8000
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: *default-logging

volumes:
  campus_pgdata:
  campus_data:
  caddy_data:
  caddy_config:
