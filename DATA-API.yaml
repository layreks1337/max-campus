# DATA-API 1.0 — обязательные проверки основного сценария «Кампуса».
# Шаблон и валидатор: https://gitverse.ru/stasnorman/example-data-api
#
# Сценарий: студент получает демо-профиль, подаёт заявку на справку об обучении,
# справка выдаётся автоматически, PDF скачивается и проверяется по публичной ссылке;
# ассистент отвечает по регламентам со ссылкой на источник; нетиповая заявка (нужен
# оригинал с печатью) уходит в деканат, тот же тестовый аккаунт включает роль
# деканата и видит её в очереди.
#
# Роли:
#   public  — без авторизации;
#   student — заголовок Authorization в формате «MaxInitData dev:<id>:<Имя>»,
#             где id из тестового диапазона 900000–999999 (вне диапазона — 401).
#             Готовое значение передаётся через защищённый канал проверки, в этом
#             файле секретов нет. Берите один и тот же id, например
#             «MaxInitData dev:990301:Expert»: повторный прогон тем же аккаунтом
#             проходит так же. Новых демо-копий для тестовых id — не больше 10 в час
#             с одного адреса (DEMO_COPIES_PER_IP_HOUR), сверх лимита demo-login
#             получит 429, и зависимые проверки не пройдут.
#
# Проверка assistant требует ключей Yandex Cloud на сервере: без них ассистент
# выключен, отвечает без источников, и проверка не проходит — так и должно быть.
#
# Данные демо: синтетические студенты, группы и шаблоны документов (см. testdata/
# и README, раздел «Что смоделировано»). Живой прогон: python scripts/check_data_api.py

schemaVersion: "1.0"

solution:
  name: "Кампус — справки и ответы по регламентам в MAX"

api:
  baseUrl: "https://195-19-202-143.sslip.io"
  openapi: "./openapi.json"
  defaultHeaders:
    Accept: "application/json"

checks:
  - id: "health"
    name: "Сервис отвечает"
    description: "Живость приложения и включённые интеграции"
    method: "GET"
    path: "/api/health"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["status", "features"]
    timeoutMs: 5000
    repeatable: true

  - id: "auth-required"
    name: "Без авторизации профиль недоступен"
    description: "Запрос без заголовка Authorization отклоняется ошибкой в едином формате"
    method: "GET"
    path: "/api/me"
    role: "public"
    expected:
      statusCodes: [401]
      contentType: "application/json"
      requiredFields: ["error"]
      bodySchema:
        type: "object"
        required: ["error"]
        properties:
          error:
            type: "object"
            required: ["code", "message"]
    timeoutMs: 5000
    repeatable: true

  - id: "demo-login"
    name: "Демо-профиль студента"
    description: "Создаёт тестовому аккаунту собственную копию демо-студента; повторный вызов возвращает тот же профиль"
    method: "POST"
    path: "/api/binding/demo"
    role: "student"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["is_bound", "role", "student"]
      bodySchema:
        type: "object"
        required: ["is_bound", "role", "student"]
        properties:
          is_bound:
            const: true
          student:
            type: "object"
            required: ["full_name", "group_name"]
    timeoutMs: 10000
    repeatable: true

  - id: "me"
    name: "Профиль текущего пользователя"
    method: "GET"
    path: "/api/me"
    role: "student"
    dependsOn: ["demo-login"]
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["max_user_id", "is_bound", "role"]
    timeoutMs: 5000
    repeatable: true

  - id: "templates"
    name: "Каталог заявок и справок"
    method: "GET"
    path: "/api/requests/templates"
    role: "student"
    dependsOn: ["demo-login"]
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
        minItems: 1
        items:
          type: "object"
          required: ["key", "title"]
    timeoutMs: 5000
    repeatable: true

  - id: "template-form"
    name: "Форма справки об обучении"
    description: "Поля формы описаны данными шаблона, а не кодом экрана"
    method: "GET"
    path: "/api/requests/templates/{key}"
    role: "student"
    dependsOn: ["templates"]
    request:
      path:
        key: "study_certificate"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["key", "title", "fields"]
    timeoutMs: 5000
    repeatable: true

  - id: "create-request"
    name: "Подача заявки на справку об обучении"
    description: "Типовая справка выдаётся автоматически; PDF уходит студенту в чат MAX"
    method: "POST"
    path: "/api/requests"
    role: "student"
    dependsOn: ["template-form"]
    request:
      headers:
        Content-Type: "application/json"
      body:
        template_key: "study_certificate"
        payload:
          purpose: "По месту требования"
          copies: 1
          need_original: false
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields: ["public_no", "status", "status_title"]
    timeoutMs: 20000
    repeatable: false
    extract:
      publicNo: "$.public_no"

  - id: "get-request"
    name: "Заявка, история статусов и выданный документ"
    method: "GET"
    path: "/api/requests/{public_no}"
    role: "student"
    dependsOn: ["create-request"]
    request:
      path:
        public_no: "${publicNo}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["public_no", "status", "events", "document"]
      bodySchema:
        type: "object"
        required: ["public_no", "status", "events", "document"]
        properties:
          document:
            type: "object"
            required: ["uuid", "download_url", "verify_url"]
    timeoutMs: 5000
    repeatable: true
    extract:
      docUuid: "$.document.uuid"

  - id: "download-document"
    name: "PDF справки скачивается"
    method: "GET"
    path: "/api/documents/{doc_uuid}"
    role: "student"
    dependsOn: ["get-request"]
    request:
      path:
        doc_uuid: "${docUuid}"
    expected:
      statusCodes: [200]
      contentType: "application/pdf"
    timeoutMs: 10000
    repeatable: true

  - id: "verify-document"
    name: "Подлинность справки проверяется по QR без авторизации"
    method: "GET"
    path: "/api/verify/{doc_uuid}"
    role: "public"
    dependsOn: ["get-request"]
    request:
      path:
        doc_uuid: "${docUuid}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["found", "valid"]
      bodySchema:
        type: "object"
        required: ["found", "valid"]
        properties:
          found:
            const: true
          valid:
            const: true
    timeoutMs: 5000
    repeatable: true

  - id: "my-requests"
    name: "Список моих заявок"
    method: "GET"
    path: "/api/requests"
    role: "student"
    dependsOn: ["create-request"]
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
        minItems: 1
        items:
          type: "object"
          required: ["public_no", "status"]
    timeoutMs: 5000
    repeatable: true

  - id: "assistant"
    name: "Ответ ассистента по регламентам с указанием источника"
    description: "Поиск по базе регламентов выполняется до обращения к модели"
    method: "POST"
    path: "/api/assistant/ask"
    role: "student"
    dependsOn: ["demo-login"]
    request:
      headers:
        Content-Type: "application/json"
      body:
        question: "Сколько дней делается справка об обучении?"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["answer", "sources"]
      bodySchema:
        type: "object"
        required: ["answer", "sources"]
        properties:
          sources:
            type: "array"
            minItems: 1
            items:
              type: "object"
              required: ["title"]
    timeoutMs: 40000
    repeatable: true

  - id: "create-manual-request"
    name: "Нетиповая заявка уходит в деканат"
    description: "Нужен оригинал с печатью — автоматически не выдаётся, заявка ждёт сотрудника"
    method: "POST"
    path: "/api/requests"
    role: "student"
    dependsOn: ["template-form"]
    request:
      headers:
        Content-Type: "application/json"
      body:
        template_key: "study_certificate"
        payload:
          purpose: "По месту требования"
          copies: 1
          need_original: true
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields: ["public_no", "status"]
      bodySchema:
        type: "object"
        required: ["public_no", "status"]
        properties:
          status:
            const: "SUBMITTED"
    timeoutMs: 10000
    repeatable: false
    extract:
      manualNo: "$.public_no"

  - id: "staff-role"
    name: "Роль деканата для демо-аккаунта"
    description: "Тот же тестовый аккаунт получает права сотрудника без кода привязки"
    method: "POST"
    path: "/api/binding/demo-staff"
    role: "student"
    dependsOn: ["demo-login"]
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["role"]
    timeoutMs: 10000
    repeatable: true

  - id: "staff-queue"
    name: "Очередь заявок деканата"
    description: "В очереди — нетиповая заявка из create-manual-request: демо-роль видит заявки своей копии"
    method: "GET"
    path: "/api/staff/requests"
    role: "student"
    dependsOn: ["staff-role", "create-manual-request"]
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
        minItems: 1
        items:
          type: "object"
          required: ["public_no", "status"]
    timeoutMs: 5000
    repeatable: true

cleanup:
  # Выданную справку не отменить — 409 здесь ожидаем
  - id: "cancel-request"
    method: "POST"
    path: "/api/requests/{public_no}/cancel"
    role: "student"
    request:
      path:
        public_no: "${publicNo}"
    expected:
      statusCodes: [200, 409]
    timeoutMs: 5000

  - id: "cancel-manual-request"
    method: "POST"
    path: "/api/requests/{public_no}/cancel"
    role: "student"
    request:
      path:
        public_no: "${manualNo}"
    expected:
      statusCodes: [200]
    timeoutMs: 5000
